name: Publish fork APK (Android 4.4.2)

# 只在本仓库（fork）生效：推送 a44-vX.Y.Z 标签即构建并发布。
# 上游的 kotlin-release.yml 仍由 github.repository == 'N3urda/hongguoTV' 保护，
# fork 上永远不会运行，因此两套流水线互不干扰。
on:
  push:
    tags: ['a44-v*']

permissions:
  contents: read

# 发布串行，避免两个标签同时上传附件。
concurrency:
  group: fork-android442-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少仓库 Secret HONGGUOTV_$name，请按 docs/FORK_RELEASE.md 配置后重试。"
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve and validate version from tag
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^a44-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签必须形如 a44-v0.13.2，当前为 $TAG"
            exit 1
          fi
          VERSION="${TAG#a44-v}"
          # 版本号唯一来源是 Gradle 源码（跟随上游），标签只做镜像，不允许改写。
          SRC_VERSION="$(grep -oP 'versionName\s*=.*\?:\s*"\K[^"]+' kotlin-tv/app/build.gradle.kts | head -1)"
          VERSION_CODE="$(grep -oP 'versionCode\s*=.*\?:\s*\K[0-9]+' kotlin-tv/app/build.gradle.kts | head -1)"
          MIN_SDK="$(grep -oP 'minSdk\s*=\s*\K[0-9]+' kotlin-tv/app/build.gradle.kts | head -1)"
          [[ -n "$SRC_VERSION" && -n "$VERSION_CODE" && -n "$MIN_SDK" ]] || { echo "::error::无法从 build.gradle.kts 读取版本"; exit 1; }
          [[ "$SRC_VERSION" == "$VERSION" ]] || { echo "::error::标签 $TAG 与源码 versionName $SRC_VERSION 不一致"; exit 1; }
          [[ "$MIN_SDK" == "19" ]] || { echo "::error::本分支必须保持 minSdk 19，当前 $MIN_SDK"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "已确认版本 ${VERSION}（versionCode ${VERSION_CODE}，minSdk ${MIN_SDK}）"

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fork-release.jks"
          test -s "$RUNNER_TEMP/fork-release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/fork-release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # AGP 8.11.0 默认 build-tools 35.0.0；本分支已禁用 native FFmpeg，无需 NDK。
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, lint and signed APKs
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          ./kotlin-tv/gradlew -p kotlin-tv \
            :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PreleaseAbis=true --console=plain

      - name: Verify signature, collect installable APKs
        id: dist
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
        run: |
          set -euo pipefail
          APK_DIR=kotlin-tv/app/build/outputs/apk/release
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist

          pick() { # $1=gradle 产物后缀 $2=对外文件名后缀
            local src="$APK_DIR/app-$1-release.apk"
            [[ -f "$src" ]] || { echo "::error::缺少构建产物 $src"; exit 1; }
            local badging certs
            badging="$("$BT/aapt" dump badging "$src")"
            grep -q "^package: name='com.hongguotv.nativeapp' versionCode='${VERSION_CODE}' versionName='${VERSION}'" <<<"$badging" \
              || { echo "::error::$src 包名/版本不符"; exit 1; }
            grep -q "^sdkVersion:'19'" <<<"$badging" || { echo "::error::$src minSdk 不是 19"; exit 1; }
            # --min-sdk-version 19 会强制校验 v1/JAR 签名，KitKat 必需。
            certs="$("$BT/apksigner" verify --verbose --min-sdk-version 19 --print-certs "$src")"
            grep -q 'Verified using v1 scheme (JAR signing): true' <<<"$certs" \
              || { echo "::error::$src 缺少 v1 签名，Android 4.4.2 无法安装"; exit 1; }
            echo "$certs" | grep 'Signer #1 certificate SHA-256 digest' | head -1
            cp "$src" "dist/hongguotv-kotlin-${VERSION}-$2.apk"
          }

          pick universal   android4
          pick armeabi-v7a arm32-v7a
          pick arm64-v8a   arm64-v8a

          # GPL-3.0：随包提供对应提交的完整源码。
          git archive --format=zip --prefix="hongguotv-${GITHUB_REF_NAME}/" \
            --output "dist/hongguotv-${GITHUB_REF_NAME}-source.zip" HEAD

          ( cd dist && sha256sum ./*.apk ./*.zip > SHA256SUMS )

          printf '%s\n' \
            "红果 TV（Android 4.4.2 / API 19 分支）${VERSION}，versionCode ${VERSION_CODE}。" \
            "" \
            "同步自上游 main 的 ${VERSION}，本仓库只做 Android 4.4.2 兼容改造，功能跟随上游。" \
            "" \
            "- 最低系统：Android 4.4.2（API 19）；FFmpeg 原生解码已禁用，音频走系统解码器。" \
            "- 三种安装包：android4（全 ABI）、arm32-v7a、arm64-v8a。" \
            "- 签名说明：本仓库使用自有证书，与上游 N3urda/hongguoTV 的正式签名不同，" \
            "  从上游版本切换过来必须【先卸载】上游 APK（会清除本机记录），不能覆盖安装。" \
            "- 源码提交：${GITHUB_SHA}；附件含 APK、对应源码 ZIP、SHA256SUMS。" \
            > dist/notes.md

          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::标签 $GITHUB_REF_NAME 的 Release 已存在，不覆盖已发布产物。"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "红果 TV ${VERSION}（Android 4.4.2）" \
            --notes-file dist/notes.md \
            --verify-tag --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-release-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            dist/

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fork-release.jks"
