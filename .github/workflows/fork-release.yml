name: Publish fork APK (Android 4.4.2)

# 只在本仓库（fork）生效：推送 a44-vX.Y.Z 标签即构建并发布。
# 上游的 kotlin-release.yml 仍由 github.repository == 'N3urda/hongguoTV' 保护，
# fork 上永远不会运行，因此两套流水线互不干扰。
on:
  push:
    tags: ['a44-v*']

permissions:
  contents: read

# 发布串行，避免两个标签同时上传附件。
concurrency:
  group: fork-android442-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少仓库 Secret HONGGUOTV_$name，请按 docs/FORK_RELEASE.md 配置后重试。"
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve and validate version from tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 规则（docs/RELEASE_POLICY.md）：a44-v<上游版本>-<N>，N 是该上游版本的第几次
          # fork 发布，从 1 开始。上游版本必须与 main 上最新的 kotlin-v* 标签一致。
          if [[ ! "$TAG" =~ ^a44-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "::error::标签必须形如 a44-v0.13.2-1，当前为 $TAG"
            exit 1
          fi
          VERSION="${TAG#a44-v}"
          REVISION="${BASH_REMATCH[2]}"
          # 版本号唯一来源是 Gradle 源码，标签只做镜像，不允许改写。
          SRC_VERSION="$(grep -oP 'versionName\s*=.*\?:\s*"\K[^"]+' kotlin-tv/app/build.gradle.kts | head -1)"
          VERSION_CODE="$(grep -oP 'versionCode\s*=.*\?:\s*\K[0-9]+' kotlin-tv/app/build.gradle.kts | head -1)"
          MIN_SDK="$(grep -oP 'minSdk\s*=\s*\K[0-9]+' kotlin-tv/app/build.gradle.kts | head -1)"
          [[ -n "$SRC_VERSION" && -n "$VERSION_CODE" && -n "$MIN_SDK" ]] || { echo "::error::无法从 build.gradle.kts 读取版本"; exit 1; }
          [[ "$SRC_VERSION" == "$VERSION" ]] || { echo "::error::标签 $TAG 与源码 versionName $SRC_VERSION 不一致"; exit 1; }
          [[ "$MIN_SDK" == "19" ]] || { echo "::error::本分支必须保持 minSdk 19，当前 $MIN_SDK"; exit 1; }
          # versionCode = 上游 versionCode * 100 + N，低两位必须与标签修订号对齐。
          if (( VERSION_CODE % 100 != REVISION )); then
            echo "::error::versionCode $VERSION_CODE 的低两位必须等于标签修订号 $REVISION"
            exit 1
          fi
          # 单调性：必须大于最近一次已发布 Release 的 versionCode，否则已装用户收不到更新。
          PREV_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" \
            --jq '(.[0] // {}) | .tag_name // ""' 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            PREV_CODE="$(gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern update.json --output - 2>/dev/null \
              | grep -oP '"versionCode"\s*:\s*\K[0-9]+' || true)"
            if [[ -n "$PREV_CODE" ]] && (( VERSION_CODE <= PREV_CODE )); then
              echo "::error::versionCode $VERSION_CODE 未大于上次发布 $PREV_TAG 的 $PREV_CODE"
              exit 1
            fi
            echo "上次发布 $PREV_TAG / versionCode ${PREV_CODE:-未知}"
          else
            echo "首次发布，无单调性基线"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "minSdk=$MIN_SDK" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "已确认版本 ${VERSION}（修订 ${REVISION}，versionCode ${VERSION_CODE}，minSdk ${MIN_SDK}）"

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fork-release.jks"
          test -s "$RUNNER_TEMP/fork-release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/fork-release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # AGP 8.11.0 默认 build-tools 35.0.0；本分支已禁用 native FFmpeg，无需 NDK。
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, lint and signed APKs
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          # 不传 -PreleaseAbis=true：本分支禁用 native FFmpeg 后 APK 内已无 lib/<abi>/，
          # ABI split 只会把同一份产物复制三份（三个 APK 的 sha256 完全相同）。
          # 通用包在任意 ABI 上都能安装，因此只构建并发布 app-release.apk。
          ./kotlin-tv/gradlew -p kotlin-tv \
            :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            --console=plain

      - name: Verify signature, collect installable APK
        id: dist
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          MIN_SDK: ${{ steps.ver.outputs.minSdk }}
        run: |
          set -euo pipefail
          APK_DIR=kotlin-tv/app/build/outputs/apk/release
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist

          # 只发布一个通用包：APK 内没有 native 库，ABI split 产出的三份内容完全相同，
          # 拆开发布只会让用户困惑（也无法据此判断该装哪个）。
          APK="$APK_DIR/app-release.apk"
          [[ -f "$APK" ]] || { echo "::error::缺少构建产物 $APK（构建是否误传了 -PreleaseAbis=true？）"; exit 1; }
          # 反向校验：一旦出现 app-<abi>-release.apk，说明 ABI 拆分被重新打开，
          # 此时产物内容可能真的不同，必须重新决定发布策略，不能静默只发通用包。
          if compgen -G "$APK_DIR/app-*-release.apk" > /dev/null; then
            echo "::error::检测到 ABI split 产物，与「只发一个通用包」的约定冲突：$(cd "$APK_DIR" && ls app-*-release.apk)"
            exit 1
          fi

          badging="$("$BT/aapt" dump badging "$APK")"
          grep -q "^package: name='com.hongguotv.nativeapp' versionCode='${VERSION_CODE}' versionName='${VERSION}'" <<<"$badging" \
            || { echo "::error::$APK 包名/版本不符"; exit 1; }
          grep -q "^sdkVersion:'19'" <<<"$badging" || { echo "::error::$APK minSdk 不是 19"; exit 1; }
          # --min-sdk-version 19 会强制校验 v1/JAR 签名，KitKat 必需。
          certs="$("$BT/apksigner" verify --verbose --min-sdk-version 19 --print-certs "$APK")"
          grep -q 'Verified using v1 scheme (JAR signing): true' <<<"$certs" \
            || { echo "::error::$APK 缺少 v1 签名，Android 4.4.2 无法安装"; exit 1; }
          echo "$certs" | grep 'Signer #1 certificate SHA-256 digest' | head -1
          # 附件名保持 android4：update.json 与已发布客户端的下载路径都依赖这个名字。
          cp "$APK" "dist/hongguotv-kotlin-${VERSION}-android4.apk"

          # GPL-3.0：随包提供对应提交的完整源码。
          git archive --format=zip --prefix="hongguotv-${GITHUB_REF_NAME}/" \
            --output "dist/hongguotv-${GITHUB_REF_NAME}-source.zip" HEAD

          # 变更记录：上一个 a44-v* 标签（没有则用最近的任意标签）到本标签之间的提交。
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'a44-v*' "${GITHUB_REF_NAME}^" 2>/dev/null \
            || git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG="$(git log --no-merges --max-count=50 \
              --pretty=format:'- %h: %s' "${PREV_TAG}..${GITHUB_REF_NAME}")"
            [[ -n "$CHANGELOG" ]] || CHANGELOG="（无提交记录）"
            CHANGELOG_HEADING="### 自 ${PREV_TAG} 以来的修改"
          else
            CHANGELOG="（首次发布，无对比基线）"
            CHANGELOG_HEADING="### 修改记录"
          fi

          printf '%s\n' \
            "红果 TV（Android 4.4.2 / API 19 分支）${VERSION}，versionCode ${VERSION_CODE}。" \
            "" \
            "同步自上游 main 的 ${VERSION}，本仓库只做 Android 4.4.2 兼容改造，功能跟随上游。" \
            "" \
            "- 最低系统：Android 4.4.2（API 19）；FFmpeg 原生解码已禁用，音频走系统解码器。" \
            "- 安装包只有一个：android4（通用包，含全部 ABI，无需按架构挑选）。" \
            "- 应用内更新读取本仓库 Release 的 update.json，标签 ${GITHUB_REF_NAME}。" \
            "- 签名说明：本仓库使用自有证书，与上游 N3urda/hongguoTV 的正式签名不同，" \
            "  从上游版本切换过来必须【先卸载】上游 APK（会清除本机记录），不能覆盖安装。" \
            "- 源码提交：${GITHUB_SHA}；附件含 APK、对应源码 ZIP、update.json、SHA256SUMS。" \
            "" \
            "$CHANGELOG_HEADING" \
            "" \
            "$CHANGELOG" \
            > dist/notes.md

          # 应用内自更新元数据：schema 与上游一致，客户端读 latest/download/update.json。
          # 指向 android4 通用包（四种 ABI），确保任何一台 4.4.2 设备都能覆盖安装。
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          version = os.environ["VERSION"]
          code = int(os.environ["VERSION_CODE"])
          min_sdk = int(os.environ["MIN_SDK"])
          tag = f"a44-v{version}"
          name = f"hongguotv-kotlin-{version}-android4.apk"
          apk = pathlib.Path("dist") / name
          if not apk.is_file():
              raise SystemExit(f"缺少自更新安装包：{apk}")
          data = apk.read_bytes()
          manifest = {
              "schema": 1,
              "packageName": "com.hongguotv.nativeapp",
              "versionCode": code,
              "versionName": version,
              "minSdk": min_sdk,
              "tag": tag,
              "apk": {"name": name, "size": len(data), "sha256": hashlib.sha256(data).hexdigest()},
              "notes": f"红果 TV {version}（Android 4.4.2）。本版签名与本仓库一致，可直接覆盖安装并保留本机记录。",
          }
          (pathlib.Path("dist") / "update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"update.json: {tag} versionCode={code} size={len(data)}")
          PY

          ( cd dist && sha256sum ./*.apk ./*.zip ./*.json > SHA256SUMS )

          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::标签 $GITHUB_REF_NAME 的 Release 已存在，不覆盖已发布产物。"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "红果 TV ${VERSION}（Android 4.4.2）" \
            --notes-file dist/notes.md \
            --verify-tag --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-release-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            dist/

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fork-release.jks"
